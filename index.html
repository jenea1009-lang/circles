<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Circles</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif}
    body{display:grid;place-items:center;background:#101828;color:#fff;padding:24px}
    main{text-align:center}
    h1{margin:0 0 8px;font-size:clamp(28px,7vw,48px)}
    p{margin:0 0 28px;color:#b8c2d1}
    .circles{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
    .circle{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:white;color:#222;border:3px solid #222;font-size:20px}
    .circle:nth-child(2){border-style:dashed}
    .circle:nth-child(3){border-width:5px}
    .circle:nth-child(1){width:210px;height:210px;background:#ffe45c;color:#222;border-color:#e0a900;transform:rotate(-3deg);font-size:26px;font-weight:700}
    .circle:nth-child(2){background:#ff7a7a;border-color:#ff3b3b;color:#fff;transform:rotate(6deg)}
    .circle:nth-child(3){background:#65d6ff;border-color:#008fc4;color:#07384a;transform:rotate(-5deg)}
    .status{margin-top:28px;font-size:14px;color:#8d9aad}
  </style>
</head>
<body>
  <main>
    <h1>Circles</h1>
    <p>Наш интерактивный эксперимент</p>
    <section class="circles" aria-label="Три круга">
      <div class="circle">Я ИЗМЕНИЛСЯ 😎</div>
      <div class="circle">Я ТОЖЕ! 🔥</div>
      <div class="circle">И Я! ⚡</div>
    </section>
    <div class="status">Версия 3 · HTML Preview</div>
  </main>
</body>
</html>
